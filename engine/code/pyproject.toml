[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eidolon"
version = "0.0.1"
description = "Find and characterise Earth analogs for Moon and Mars sites (NASA Space Apps 2026)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
